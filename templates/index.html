<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Auth Demo</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="container">
      <h1>Username/Password Demo</h1>

      <section class="card">
        <h2>Register</h2>
        <input id="regUsername" placeholder="username" />
        <input id="regName" placeholder="name" />
        <input id="regPassword" type="password" placeholder="password" />
        <button id="regBtn">Register</button>
        <p id="regStatus" class="status"></p>
      </section>

      <section class="card">
        <h2>Login</h2>
        <input id="loginUsername" placeholder="username" />
        <input id="loginPassword" type="password" placeholder="password" />
        <button id="loginBtn">Login</button>
        <p id="loginStatus" class="status"></p>
      </section>

      <section class="card">
        <h2>Protected</h2>
        <button id="callProtected">Call Protected Endpoint</button>
        <p id="protectedResult" class="status"></p>
      </section>
    </main>

    <script src="/static/script.js"></script>
  </body>
</html>
